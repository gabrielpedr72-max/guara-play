<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Player</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:system-ui,sans-serif;overflow:hidden;cursor:none}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center}
[data-rot="180"] #stage{transform:rotate(180deg)}
[data-rot="90"] #stage{inset:auto;top:0;left:100vw;width:100vh;height:100vw;transform-origin:0 0;transform:rotate(90deg)}
[data-rot="270"] #stage{inset:auto;top:100vh;left:0;width:100vh;height:100vw;transform-origin:0 0;transform:rotate(-90deg)}
#stage img,#stage video{width:100%;height:100%;object-fit:var(--fit,contain)}
.big{font-size:min(18vw,18vh);font-weight:700;letter-spacing:.08em;font-variant-numeric:tabular-nums}
.sub{font-size:min(4vw,4vh);opacity:.7;margin-top:1vh}
</style></head><body>
<div id="stage"></div>
<script>
const NATIVE = new URLSearchParams(location.search).has('native'); // rodando dentro do app Android
const $ = s => document.querySelector(s), wait = ms => new Promise(r => setTimeout(r, ms));
// crypto.randomUUID e a Cache API só existem em HTTPS/localhost; em http://IP-da-rede usamos alternativas.
const uid = () => crypto.randomUUID ? crypto.randomUUID() : ([1e7] + -1e3 + -4e3 + -8e3 + -1e11).replace(/[018]/g, c => (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16));
// Enquanto a tela não estiver pareada, cada abertura gera uma identidade (e um código) novos.
// Depois de pareada, a identidade fica salva para a tela voltar sozinha após reiniciar.
if (localStorage.paired !== '1') { localStorage.dev = uid(); localStorage.removeItem('man'); }
let dev = localStorage.dev;
const PLAT = /Android/i.test(navigator.userAgent) ? 'Android' : /Windows/i.test(navigator.userAgent) ? 'Windows' : /iPhone|iPad|Macintosh/i.test(navigator.userAgent) ? 'Apple' : 'Outro';
let man = JSON.parse(localStorage.man || 'null'), cur = '', run = 0, stop = () => {};
const stage = $('#stage');
const msg = (a, b = '') => stage.innerHTML = `<div><div class="big">${a}</div><div class="sub">${b}</div></div>`;

if ('serviceWorker' in navigator && !NATIVE) navigator.serviceWorker.register('/sw.js').catch(() => {});
addEventListener('click', () => document.documentElement.requestFullscreen?.().catch(() => {}));
navigator.wakeLock?.request('screen').catch(() => {});

// Baixa a mídia uma vez e guarda no cache do aparelho (funciona offline).
async function fetchBlob(url) {
  if (!self.caches) { const r = await fetch(url); if (!r.ok) throw 0; return r.blob(); }
  const c = await caches.open('media');
  let r = await c.match(url);
  if (!r) { r = await fetch(url); if (!r.ok) throw 0; await c.put(url, r.clone()); }
  return r.blob();
}
async function prefetch(items) {
  if (!self.caches || NATIVE) return; // no app, o próprio aparelho já baixa tudo antes
  const urls = items.filter(i => i.url).map(i => i.url), c = await caches.open('media');
  for (const k of await c.keys()) if (!urls.includes(new URL(k.url).pathname)) c.delete(k);
  for (const u of urls) { try { await fetchBlob(u); } catch {} }
}

async function poll() {
  try { const r = await fetch('/api/player?device=' + dev + '&p=' + PLAT, { cache: 'no-store' }); man = await r.json(); localStorage.man = JSON.stringify(man); if (man.capture) doCapture(); } catch {}
  apply();
}
function apply() {
  if (!man || man.connecting) {
    const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    return msg('Conectando…', man && man.error ? 'Sem conexão com ' + esc(man.server || '') + '<br>' + esc(man.error) : 'Aguardando o servidor');
  }
  if (man.downloading) { run++; stop(); cur = ''; return msg('Baixando conteúdo…', man.downloading); }
  if (man.paired) localStorage.paired = '1';
  else if (localStorage.paired === '1') { // tela removida no painel: volta a pedir pareamento com código novo
    localStorage.paired = ''; localStorage.dev = dev = uid(); localStorage.removeItem('man'); return poll();
  }
  if (!man.paired) { cur = ''; run++; stop(); self.caches?.delete('media'); return msg(man.code, 'Digite este código no painel para parear a tela'); }
  if (man.version === cur) return;
  cur = man.version; run++; stop();
  document.body.dataset.rot = man.rotation || 0; document.body.style.setProperty('--fit', man.fit || 'contain');
  prefetch(man.items); loop(run);
}

async function loop(id) {
  if (!man.items.length) return msg('Playlist vazia', 'Adicione conteúdo no painel');
  let i = 0;
  while (id === run) {
    const it = man.items[i++ % man.items.length];
    try { await play(it); } catch { await wait(1500); }
  }
}
// ---- relatório de exibição: soma, por hora (UTC) e conteúdo, quanto tempo cada coisa ficou na tela ----
const jget = (k, d) => { try { return JSON.parse(localStorage[k]) || d; } catch { return d; } };
function rec(it, ms) {
  const sec = Math.min(ms / 1000, 3600); if (sec < 1 || !it.id) return;
  try { const acc = jget('gacc', {}), k = new Date().toISOString().slice(0, 13) + '|' + it.id, r = acc[k] || (acc[k] = [0, 0]);
    r[0] += sec; r[1] += 1; localStorage.gacc = JSON.stringify(acc); } catch {}
}
async function flushLog() { // envia o acumulado; se estiver sem internet, guarda e tenta de novo depois
  try {
    let pend = jget('gpend', null);
    if (!pend) {
      const acc = jget('gacc', {}), ks = Object.keys(acc); if (!ks.length) return;
      pend = { b: uid(), rows: ks.map(k => { const [h, c] = k.split('|'); return { h, c, s: Math.round(acc[k][0]), n: acc[k][1] }; }) };
      localStorage.gpend = JSON.stringify(pend); localStorage.gacc = '{}';
    }
    const r = await fetch('/api/player/log?device=' + dev, { method: 'POST', body: JSON.stringify(pend) });
    if (r.ok) localStorage.removeItem('gpend');
  } catch {}
}
setInterval(flushLog, 60000);
async function play(it) {
  let t0 = 0; // só conta a partir do momento em que o conteúdo realmente apareceu
  const cancel = new Promise(r => stop = r);
  const work = (async () => {
    if (it.type === 'clock') {
      const tick = () => { const d = new Date(); stage.innerHTML = `<div><div class="big">${d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}</div><div class="sub">${d.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' })}</div></div>`; };
      tick(); t0 = Date.now(); const t = setInterval(tick, 1000); try { await Promise.race([wait(it.seconds * 1000), cancel]); } finally { clearInterval(t); } return;
    }
    const url = NATIVE ? it.url : URL.createObjectURL(await fetchBlob(it.url)); // no app: toca direto do arquivo, sem carregar na memória
    try {
      if (it.type === 'image') { stage.innerHTML = `<img src="${url}">`; t0 = Date.now(); await wait(it.seconds * 1000); }
      else await new Promise((ok, no) => { const v = document.createElement('video'); v.src = url; v.muted = !man.sound; v.autoplay = v.playsInline = true;
        v.onplaying = () => { if (!t0) t0 = Date.now(); }; v.onended = ok; v.onerror = no; stage.replaceChildren(v); v.play().catch(() => { v.muted = true; v.play().catch(no); }); });
    } finally { if (!NATIVE) URL.revokeObjectURL(url); }
  })();
  try { await Promise.race([work, cancel]); } finally { if (t0) rec(it, Date.now() - t0); }
}

// Captura do que está na tela e envia ao painel (a pedido).
let capBusy = false;
async function doCapture() {
  if (capBusy) return; capBusy = true;
  try {
    const vert = (+man.rotation || 0) % 180 !== 0, W0 = vert ? innerHeight : innerWidth, H0 = vert ? innerWidth : innerHeight, k = Math.min(1, 640 / W0);
    const W = Math.round(W0 * k), H = Math.round(H0 * k), c = document.createElement('canvas'); c.width = W; c.height = H;
    const g = c.getContext('2d'); g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
    const el = stage.querySelector('img,video');
    if (el) {
      const sw = el.videoWidth || el.naturalWidth, sh = el.videoHeight || el.naturalHeight;
      if (sw && sh) { const fit = man.fit || 'contain'; let dw = W, dh = H, dx = 0, dy = 0;
        if (fit !== 'fill') { const f = fit === 'cover' ? Math.max(W / sw, H / sh) : Math.min(W / sw, H / sh); dw = sw * f; dh = sh * f; dx = (W - dw) / 2; dy = (H - dh) / 2; }
        g.drawImage(el, dx, dy, dw, dh); }
    } else { // relógio ou mensagem
      g.fillStyle = '#fff'; g.textAlign = 'center';
      g.font = `700 ${H * 0.18}px sans-serif`; g.fillText(stage.querySelector('.big')?.textContent || '', W / 2, H / 2);
      g.font = `${H * 0.05}px sans-serif`; g.fillText(stage.querySelector('.sub')?.textContent || '', W / 2, H / 2 + H * 0.1);
    }
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.7));
    await fetch('/api/player/capture?device=' + dev, { method: 'POST', body: blob });
  } catch {} finally { capBusy = false; }
}

apply(); poll(); setInterval(poll, 10000);
</script></body></html>
