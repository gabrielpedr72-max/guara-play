<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guará Play</title><link rel="icon" href="/logo.png">
<style>
:root{--bg:#f2f3f5;--card:#fff;--ink:#16181d;--mut:#667085;--line:#e1e4e9;--ac:#f2a900;--acink:#161200;--ok:#1f9d55;--warn:#f08c00;--bad:#d64545;--off:#9aa3ad;--side:#0c0c0d;--sideink:#d8dbe0}
[data-theme=dark]{--bg:#0f1114;--card:#171a1f;--ink:#e8eaee;--mut:#98a2b3;--line:#2a2f37}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,sans-serif}
button,select,input{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:7px 11px}
button{cursor:pointer}button.p{background:var(--ac);border-color:var(--ac);color:var(--acink);font-weight:600}button.d{color:var(--bad)}
:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.app{display:flex;min-height:100vh}
.side{width:240px;background:var(--side);color:var(--sideink);padding:16px 12px;display:flex;flex-direction:column;gap:8px;position:sticky;top:0;height:100vh;flex:none}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 12px;font-weight:700;color:#fff;font-size:17px}.brand img{width:40px;height:40px;border-radius:8px}
.gs{display:block;border-radius:8px;padding:10px 12px;font-weight:600;color:#fff;text-align:center;margin-bottom:6px}
.gs{text-decoration:none}.gs.ok,.gs.warn,.gs.bad,.gs.off{color:#fff}
.gs.ok{background:var(--ok)}.gs.warn{background:var(--warn)}.gs.bad{background:var(--bad)}.gs.off{background:#3a3f47}
.side nav a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:8px;color:var(--sideink);text-decoration:none;border-left:3px solid transparent}
.side nav a:hover{background:#1a1b1e}.side nav a.on{background:#1d1c17;color:#fff;border-left-color:var(--ac)}
.side svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.foot{margin-top:auto;display:flex;flex-direction:column;gap:6px}.foot button{background:#17181b;border-color:#26282d;color:var(--sideink);text-align:left}
main{flex:1;min-width:0;padding:22px 26px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
.ph{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}.ph h1{font-size:19px;margin:0;margin-right:auto;text-transform:uppercase;letter-spacing:.03em}
.tb{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.tb input[type=search]{flex:1;min-width:180px}.tb label{font-size:12px;color:var(--mut);display:flex;gap:6px;align-items:center;text-transform:uppercase}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 12px;border-top:1px solid var(--line);vertical-align:middle}th{border-top:0;font-size:13px;white-space:nowrap}td.c,th.c{width:34px;padding-right:0}
tbody tr:nth-child(odd){background:color-mix(in srgb,var(--ink) 3%,transparent)}
tr.b-ok td:first-child{box-shadow:inset 5px 0 var(--ok)}tr.b-warn td:first-child{box-shadow:inset 5px 0 var(--warn)}tr.b-bad td:first-child{box-shadow:inset 5px 0 var(--bad)}tr.b-off td:first-child{box-shadow:inset 5px 0 var(--off)}
.chip{display:inline-block;border:1px solid var(--line);background:color-mix(in srgb,var(--ink) 6%,transparent);border-radius:5px;padding:2px 9px;font-size:13px;margin:2px 4px 2px 0}
button.chip{cursor:pointer;color:var(--ink)}.dur{border-color:var(--ac);color:var(--ac);font-variant-numeric:tabular-nums}
.mut{color:var(--mut)}.pg{display:flex;gap:10px;align-items:center;margin-top:12px;font-size:13px;color:var(--mut);flex-wrap:wrap}.pg span{margin-right:auto}
.bulk{display:flex;gap:10px;align-items:center;padding:8px 12px;margin-bottom:10px;border:1px solid var(--ac);border-radius:8px;flex-wrap:wrap}
.lg{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin-top:12px}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.big{display:flex;gap:12px;align-items:center;border-radius:8px;padding:14px 18px;color:#fff;font-size:19px;font-weight:600;margin-bottom:18px}
.st{display:flex;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--line)}.st:first-child{border-top:0}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.stats .card{margin:0;border-top:4px solid var(--ac)}
.stats h3{margin:0 0 8px;font-size:14px;text-transform:uppercase;letter-spacing:.04em}.stats div.r{display:flex;justify-content:space-between;padding:5px 0;border-top:1px solid var(--line)}.stats b{font-variant-numeric:tabular-nums}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:20px;width:min(520px,94vw)}dialog::backdrop{background:#0009}
dialog h2{margin:0 0 12px;font-size:17px}.f{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;font-size:13px;color:var(--mut)}.f input,.f select{font-size:15px;color:var(--ink)}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}.acts .l{margin-right:auto}
.th{width:64px;height:40px;object-fit:cover;border-radius:4px;background:var(--line);cursor:pointer;display:block}
.tgb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;font-size:13px}.tgb b{text-transform:uppercase;letter-spacing:.04em}.tg.on{font-weight:700}.tr{display:flex;gap:8px;margin-bottom:8px}.tr input:not([type=color]){flex:1}.tr input[type=color]{width:42px;padding:2px;height:36px}
.off{color:var(--off)}.dk{width:auto}.days{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.days label{display:flex;gap:4px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:3px 8px;cursor:pointer}
.strip{display:flex;gap:4px;align-items:center}.strip .th{width:52px;height:32px}.clk{display:flex;align-items:center;justify-content:center;background:#000;color:#fff;font-size:12px;cursor:default}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:10px}.gal button{display:flex;flex-direction:column;gap:4px;padding:6px;text-align:left;min-width:0}.gal button[hidden]{display:none}
.gal .th{width:100%;height:auto;aspect-ratio:16/9;cursor:inherit}.gal span.n{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.err{color:var(--bad)}input[type=number]{width:76px}
.info{font-size:13px;color:var(--mut);margin:0 0 12px;padding-left:18px}
@media(max-width:820px){.app{flex-direction:column}.side{width:auto;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center}.foot{flex-direction:row;margin:0}.side nav{display:flex;flex-wrap:wrap}.gs{margin:0}main{padding:14px}}
</style></head><body><div id="root"></div><dialog id="dlg"></dialog>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.documentElement.dataset.theme = localStorage.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
let token = localStorage.t || '', S = { media: [], playlists: [], screens: [], now: 0, at: 0 }, ed = null;
const T = {}; for (const k of ['screens', 'files', 'lists']) T[k] = { q: '', sort: k === 'screens' ? 'created' : k === 'files' ? 'created' : 'created', per: 15, page: 1, sel: new Set(), cur: [], ft: new Set() };

async function api(p, o = {}) {
  const r = await fetch('/api/' + p, { ...o, headers: { ...o.headers, authorization: 'Bearer ' + token } });
  if (r.status === 401 && p !== 'login') { token = ''; localStorage.t = ''; showLogin(); throw new Error('login'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Erro ' + r.status);
  return j;
}
const send = (p, method, body) => api(p, { method, headers: { 'content-type': 'application/json' }, body: JSON.stringify(body || {}) });
const load = async () => { S = { ...(await api('state')), at: Date.now() }; };
const toast = m => alert(m);
const guard = fn => async (...a) => { try { await fn(...a); } catch (e) { if (e.message !== 'login') toast(e.message); } };

/* ---------- helpers ---------- */
const nowMs = () => S.now + (Date.now() - S.at);
const DAYS = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
const inSched = (s, d = new Date()) => { const x = s.schedule; if (!x?.days?.length) return true;
  const hm = t => +t.slice(0, 2) * 60 + +t.slice(3), m = d.getHours() * 60 + d.getMinutes(), a = hm(x.start), b = hm(x.end), day = d.getDay(), prev = (day + 6) % 7;
  if (a === b) return x.days.includes(day);
  return a < b ? x.days.includes(day) && m >= a && m < b : (x.days.includes(day) && m >= a) || (x.days.includes(prev) && m < b); };
const schedTxt = s => { const x = s.schedule; if (!x?.days?.length) return 'Sempre'; return `${x.days.length === 7 ? 'Todos os dias' : [...x.days].sort().map(i => DAYS[i]).join(', ')} · ${x.start}–${x.end}`; };
const stOf = s => { const d = s.seen ? nowMs() - s.seen : Infinity; return d < 45000 ? 'ok' : d < 180000 ? 'warn' : inSched(s) ? 'bad' : 'off'; };
const ST = { ok: 'Funcionando corretamente', warn: 'Em verificação', bad: 'Sem comunicação', off: 'Sem comunicação fora do horário de funcionamento' };
const RANK = { bad: 3, warn: 2, off: 1, ok: 0 };
const ago = t => { if (!t) return 'nunca conectou'; const s = Math.round((nowMs() - t) / 1000);
  return s < 45 ? 'agora' : 'há ' + (s < 3600 ? Math.round(s / 60) + ' min' : s < 86400 ? Math.round(s / 3600) + ' h' : Math.round(s / 86400) + ' d'); };
const fmt = n => { n = Math.round(n || 0); const p = x => String(x).padStart(2, '0'); return `${p(Math.floor(n / 3600))}:${p(Math.floor(n / 60) % 60)}:${p(n % 60)}`; };
const fsize = b => !b ? '—' : b > 1e9 ? (b / 1e9).toFixed(2) + ' GB' : b > 1e6 ? (b / 1e6).toFixed(1) + ' MB' : Math.ceil(b / 1e3) + ' KB';
const kind = m => m.kind || (m.type === 'image' && /\.gif$/i.test(m.file) ? 'gif' : m.type);
const KN = { video: 'Vídeo', image: 'Imagem', gif: 'GIF' };
const media = id => S.media.find(m => m.id === id);
const plOf = id => S.playlists.find(p => p.id === id);
const itemSec = i => i.kind === 'clock' ? i.seconds : (m => !m ? 0 : m.type === 'video' ? (m.duration || 0) : i.seconds)(media(i.mediaId));
const plDur = p => p.items.reduce((a, i) => a + itemSec(i), 0);
const hue = id => [...String(id)].reduce((a, c) => (a * 31 + c.charCodeAt(0)) % 360, 7);
const tag = (id, n) => `<span class="chip" style="background:hsl(${hue(id)} 75% 50% / .2)">${esc(n)}</span>`;
const plOpts = sel => '<option value="">Sem lista</option>' + S.playlists.map(p => `<option value="${p.id}" ${p.id === sel ? 'selected' : ''}>${esc(p.name)}</option>`).join('');
const thumb = (m, click = true) => !m ? '<span class="th"></span>' : m.type === 'image'
  ? `<img class="th" src="/media/${m.file}" loading="lazy" alt="" ${click ? `onclick="preview('${m.id}')"` : ''}>`
  : `<video class="th" src="/media/${m.file}#t=0.5" preload="metadata" muted playsinline ${click ? `onclick="preview('${m.id}')"` : ''}></video>`;
const clockThumb = '<span class="th clk">12:00</span>';
const itemThumb = (i, click = true) => i.kind === 'clock' ? clockThumb : thumb(media(i.mediaId), click);
const strip = p => p.items.length ? `<div class="strip">${p.items.slice(0, 4).map(i => itemThumb(i, false)).join('')}${p.items.length > 4 ? `<span class="mut">+${p.items.length - 4}</span>` : ''}</div>` : '<span class="mut">—</span>';
const galFilter = q => document.querySelectorAll('.gal button[data-n]').forEach(b => b.hidden = !b.dataset.n.includes(q.trim().toLowerCase()));
const tagsOf = sc => (S.tags || []).filter(t => t.scope === sc);
const tagById = id => (S.tags || []).find(t => t.id === id);
const tagChip = t => `<span class="chip" style="background:${t.color}2e;border-color:${t.color}">${esc(t.name)}</span>`;
const tagChips = ids => (ids || []).map(tagById).filter(Boolean).map(tagChip).join('') || '<span class="mut">—</span>';
const tagNames = r => (r.tags || []).map(id => tagById(id)?.name || '').join(' ');
const tagPicker = (sc, sel = [], fn = '') => `<div class="f">Etiquetas<div>${tagsOf(sc).map(t => `<label class="chip" style="background:${t.color}2e;border-color:${t.color};cursor:pointer"><input type="checkbox" class="tk" value="${t.id}" ${sel.includes(t.id) ? 'checked' : ''} ${fn ? `onchange="${fn}('${t.id}',this.checked)"` : ''} style="width:auto"> ${esc(t.name)}</label>`).join('') || '<span class="mut">Nenhuma etiqueta criada. Use “Gerenciar” na página.</span>'}</div></div>`;
const pickedTags = () => [...document.querySelectorAll('.tk:checked')].map(x => x.value);
const ROT = [[0, '0° (normal)'], [90, '90° horário'], [180, '180° (de cabeça para baixo)'], [270, '270° anti-horário']];
const FIT = [['contain', 'Ajustar sem cortar'], ['cover', 'Preencher cortando'], ['fill', 'Esticar']];
const rotOpts = c => ROT.map(([v, n]) => `<option value="${v}" ${(+c || 0) === v ? 'selected' : ''}>${n}</option>`).join('');
const ICON = {
  telas: '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>',
  arquivos: '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-8 8"/></svg>',
  listas: '<svg viewBox="0 0 24 24"><path d="M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>',
  relatorios: '<svg viewBox="0 0 24 24"><path d="M5 20V11M11 20V4M17 20v-6M3 20h18"/></svg>',
  status: '<svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>',
  conta: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>' };

/* ---------- modal ---------- */
const dlg = $('#dlg');
const modal = h => { dlg.innerHTML = h; dlg.showModal(); };
const closeM = () => dlg.close();
dlg.addEventListener('click', e => { if (e.target === dlg) closeM(); });

/* ---------- login / shell ---------- */
function showLogin() {
  $('#root').innerHTML = `<div class="card" style="max-width:340px;margin:12vh auto;text-align:center"><img src="/logo.png" width="84" height="84" style="border-radius:14px"><h2>Guará Play</h2>
  <form id="lf"><input id="pw" type="password" autocomplete="current-password" autofocus placeholder="Senha" style="width:100%;margin-bottom:10px">
  <button class="p" type="submit" style="width:100%">Entrar</button></form><p class="err" id="e"></p><p class="mut" id="srv" style="font-size:13px"></p></div>`;
  $('#lf').onsubmit = async ev => { ev.preventDefault(); $('#e').textContent = '';
    try { token = (await send('login', 'POST', { pass: $('#pw').value })).token; localStorage.t = token; await boot(); }
    catch (x) { $('#e').textContent = x.message === 'Failed to fetch' ? 'Sem conexão com o servidor.' : x.message; } };
  fetch('/api/login', { method: 'POST', body: '{}' }).then(r => { if (r.status !== 401) throw 0; })
    .catch(() => $('#srv').textContent = 'Não consegui falar com o servidor. Abra pelo endereço http://localhost:3000 com "node server.js" rodando.');
  $('#pw').focus();
}
async function boot() {
  await load();
  $('#root').innerHTML = `<div class="app"><aside class="side"><div class="brand"><img src="/logo.png" alt=""><span>Guará Play</span></div><a class="gs" id="gs" href="#/status"></a>
  <nav>${[['telas', 'Telas'], ['arquivos', 'Arquivos'], ['listas', 'Listas de Reprodução'], ['relatorios', 'Relatórios'], ['status', 'Status'], ['conta', 'Minha conta']].map(([k, n]) => `<a href="#/${k}" data-r="${k}">${ICON[k]}${n}</a>`).join('')}</nav>
  <div class="foot"><button id="tm"></button><button onclick="token='';localStorage.t='';showLogin()">Sair</button></div></aside><main id="page"></main></div>`;
  const tm = $('#tm'), lbl = () => tm.textContent = document.documentElement.dataset.theme === 'dark' ? 'Modo claro' : 'Modo escuro';
  tm.onclick = () => { const d = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = localStorage.theme = d; lbl(); }; lbl();
  route(); fixDur();
}
function sideStatus() {
  const g = $('#gs'); if (!g) return; const c = { ok: 0, warn: 0, bad: 0, off: 0 }; S.screens.forEach(s => c[stOf(s)]++);
  const [cl, t] = !S.screens.length ? ['off', 'Sem telas'] : c.bad ? ['bad', `${c.bad} sem comunicação`] : c.warn ? ['warn', 'Em verificação'] : ['ok', 'Todas funcionando'];
  g.className = 'gs ' + cl; g.textContent = t;
}

/* ---------- tabelas ---------- */
const V = {
  screens: { noun: 'telas', bar: stOf, noun1: 'tela',
    sorts: { created: ['Data de vínculo', (a, b) => (b.created || 0) - (a.created || 0)], name: ['Nome (A–Z)', (a, b) => a.name.localeCompare(b.name)], status: ['Status (problemas primeiro)', (a, b) => RANK[stOf(b)] - RANK[stOf(a)]] },
    rows: () => S.screens, text: s => s.name + ' ' + (plOf(s.playlistId)?.name || '') + ' ' + tagNames(s),
    cols: [{ h: 'Nome', td: s => `<button class="chip" onclick="editScreen('${s.id}')">${esc(s.name)}</button>` },
      { h: 'Etiquetas', td: s => tagChips(s.tags) },
      { h: 'Lista de reprodução', td: s => plOf(s.playlistId) ? tag(s.playlistId, plOf(s.playlistId).name) : '<span class="mut">—</span>' },
      { h: 'Aparelho', td: s => s.platform || '<span class="mut">—</span>' }, { h: 'Rotação', td: s => (s.rotation || 0) + '°' },
      { h: 'Última conexão', td: s => ago(s.seen) }, { h: 'Horário', td: s => schedTxt(s) },
      { h: 'Captura de tela', td: s => `<button onclick="capture('${s.id}')" aria-label="Captura de tela de ${esc(s.name)}"><svg viewBox="0 0 24 24" style="width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linejoin:round;display:block"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>` }] },
  files: { noun: 'arquivos',
    sorts: { created: ['Data de envio', (a, b) => (b.created || 0) - (a.created || 0)], name: ['Nome (A–Z)', (a, b) => a.name.localeCompare(b.name)], size: ['Tamanho', (a, b) => (b.size || 0) - (a.size || 0)] },
    rows: () => S.media, text: m => m.name + ' ' + KN[kind(m)] + ' ' + tagNames(m),
    cols: [{ h: 'Nome', td: m => `<button class="chip" onclick="editFile('${m.id}')">${esc(m.name)}</button>` }, { h: 'Etiquetas', td: m => tagChips(m.tags) }, { h: 'Tipo', td: m => KN[kind(m)] },
      { h: 'Duração', td: m => m.type === 'video' ? (m.duration ? fmt(m.duration) : '…') : '<span class="mut">—</span>' }, { h: 'Tamanho', td: m => fsize(m.size) },
      { h: 'Pré-visualização', td: m => m.type === 'image' ? `<img class="th" src="/media/${m.file}" onclick="preview('${m.id}')" alt="">` : `<video class="th" src="/media/${m.file}#t=0.5" preload="metadata" muted onclick="preview('${m.id}')"></video>` }] },
  lists: { noun: 'listas',
    sorts: { created: ['Data de criação', (a, b) => (b.created || 0) - (a.created || 0)], name: ['Nome (A–Z)', (a, b) => a.name.localeCompare(b.name)], dur: ['Duração', (a, b) => plDur(b) - plDur(a)] },
    rows: () => S.playlists, text: p => p.name + ' ' + tagNames(p),
    cols: [{ h: 'Nome', td: p => `<a class="chip" style="color:inherit;text-decoration:none" href="#/listas/${p.id}">${esc(p.name)}</a>` },
      { h: 'Prévia', td: p => strip(p) },
      { h: 'Etiquetas', td: p => tagChips(p.tags) },
      { h: 'Telas que veiculam esta lista', td: p => S.screens.filter(s => s.playlistId === p.id).map(s => tag(s.id, s.name)).join('') || '<span class="mut">Nenhuma</span>' },
      { h: 'Tempo de duração', td: p => `<span class="chip dur">${fmt(plDur(p))}</span>` }] },
};
function listPage(key, title, btn, extra = '') {
  const v = V[key], t = T[key];
  $('#page').innerHTML = `<div class="card"><div class="ph"><h1>${title}</h1>${btn}</div>${extra}<div id="tagbar"></div>
  <div class="tb"><input type="search" placeholder="Pesquisar…" value="${esc(t.q)}" oninput="T.${key}.q=this.value;T.${key}.page=1;renderTbl('${key}')">
  <label>Ordenar por <select onchange="T.${key}.sort=this.value;renderTbl('${key}')">${Object.entries(v.sorts).map(([k, [n]]) => `<option value="${k}" ${t.sort === k ? 'selected' : ''}>${n}</option>`).join('')}</select></label>

  $('#page').innerHTML = `<div style="max-width:760px;margin:0 auto"><div class="big" style="background:var(--${cl})">${t}</div><h1 style="font-size:22px">Status das telas</h1>
  <div class="card" style="padding:0">${[...S.screens].sort((a, b) => RANK[stOf(b)] - RANK[stOf(a)] || a.name.localeCompare(b.name)).map(s => `<div class="st"><span>${esc(s.name)}</span><span class="${stOf(s)}">${icon[stOf(s)]} <span class="mut" style="font-size:12px">· ${ago(s.seen)}</span></span></div>`).join('') || '<div class="st mut">Vincule uma tela para acompanhar o status.</div>'}</div>
  <div class="lg" style="justify-content:center">${Object.entries(ST).map(([k, n]) => `<span><i style="background:var(--${k})"></i>${n}</span>`).join('')}</div></div>`;
}

/* ---------- Minha conta ---------- */
function pConta() {
  const L = S.playlists, by = [...L].sort((a, b) => b.items.length - a.items.length), ks = k => S.media.filter(m => kind(m) === k).length;
  const sc = S.screens, rows = (g, a) => a.map(([n, v]) => `<div class="r"><span class="mut">${n}</span><b>${v}</b></div>`).join('');
  const lf = p => p ? `${esc(p.name)} [${p.items.length}]` : '—';
  $('#page').innerHTML = `<div class="card"><div class="ph"><h1>Minha conta · Estatísticas</h1></div><div class="stats">
  <div class="card" style="border-top-color:var(--ok)"><h3>Listas de reprodução</h3>${rows(0, [['Listas', L.length], ['Lista com mais itens', lf(by[0])], ['Lista com menos itens', lf(by[by.length - 1])]])}</div>
  <div class="card"><h3>Arquivos</h3>${rows(0, [['Total de arquivos', S.media.length], ['Vídeos', ks('video')], ['Imagens', ks('image')], ['GIFs animados', ks('gif')]])}</div>
  <div class="card" style="border-top-color:#8a4fff"><h3>Telas</h3>${rows(0, [['Telas', sc.length], ['Com Windows', sc.filter(s => s.platform === 'Windows').length], ['Com Android', sc.filter(s => s.platform === 'Android').length],
    ['Horizontais', sc.filter(s => !((s.rotation || 0) % 180)).length], ['Verticais', sc.filter(s => (s.rotation || 0) % 180).length]])}</div></div></div>`;
}

/* ---------- Relatórios ---------- */
//#pure-start
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const addDays = (s, n) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return iso(d); };
const fdur = s => { s = Math.round(s); if (s >= 3600) return `${Math.floor(s / 3600)}h ${String(Math.floor(s % 3600 / 60)).padStart(2, '0')}min`; if (s >= 60) return `${Math.floor(s / 60)}min`; return `${s}s`; };
const fhr = s => (s / 3600).toFixed(1).replace('.', ',');
const bkey = (d, g) => { if (g === 'month') return d.slice(0, 7); if (g === 'week') { const x = new Date(d + 'T12:00:00'); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return iso(x); } return d; };
const blabel = (k, g) => g === 'month' ? k.slice(5) + '/' + k.slice(2, 4) : k.slice(8) + '/' + k.slice(5, 7);
function relAgg(data, from, to, f) { // soma o período respeitando os filtros de tela e de conteúdo
  const keys = [], disp = {}, onl = {}, perScreen = {}, perContent = {}, tot = { secs: 0, plays: 0, online: 0 }; let days = 0;
  for (let d = from; d <= to; d = addDays(d, 1)) {
    days++; const k = bkey(d, f.gran); if (!(k in disp)) { keys.push(k); disp[k] = 0; onl[k] = 0; }
    for (const [sid, e] of Object.entries(data.days[d] || {})) {
      if (f.screen && f.screen !== sid) continue;
      const ps = perScreen[sid] ||= { online: 0, secs: 0, plays: 0 };
      ps.online += e.online || 0; onl[k] += e.online || 0; tot.online += e.online || 0;
      for (const [cid, [sec, n]] of Object.entries(e.c || {})) {
        if (f.content && f.content !== cid) continue;
        ps.secs += sec; ps.plays += n; disp[k] += sec; tot.secs += sec; tot.plays += n;
        const pc = perContent[cid] ||= { secs: 0, plays: 0 }; pc.secs += sec; pc.plays += n;
      }
    }
  }
  return { keys, disp, onl, tot, perScreen, perContent, days };
}
//#pure-end
const R = { preset: '7d', from: '', to: '', gran: 'day', screen: '', content: '', data: null };
function relRange(today) {
  if (R.preset === 'custom') return [R.from || today, R.to || today];
  if (R.preset === 'today') return [today, today];
  if (R.preset === '7d') return [addDays(today, -6), today];
  if (R.preset === '30d') return [addDays(today, -29), today];
  const [y, m] = today.split('-').map(Number), p2 = n => String(n).padStart(2, '0');
  if (R.preset === 'month') return [`${y}-${p2(m)}-01`, today];
  const ly = m === 1 ? y - 1 : y, lm = m === 1 ? 12 : m - 1;
  return [`${ly}-${p2(lm)}-01`, `${ly}-${p2(lm)}-${p2(new Date(ly, lm, 0).getDate())}`];
}
function relChart(a, f) {
  const W = 800, H = 250, L = 46, B = 26, T = 10, n = a.keys.length, showO = !f.content;
  const vals = a.keys.map(k => a.disp[k] / 3600), onl = a.keys.map(k => a.onl[k] / 3600);
  const mx = Math.max(0.1, ...vals, ...(showO ? onl : [])), pw = 10 ** Math.floor(Math.log10(mx)), top = Math.ceil(mx / pw * 2) / 2 * pw;
  const bw = (W - L - 8) / n, bar = Math.min(bw * 0.7, 44), y = v => T + (H - T - B) * (1 - v / top), cx = i => L + bw * (i + 0.5), step = Math.ceil(n / 14);
  const grid = [0, top / 2, top].map(v => `<line x1="${L}" x2="${W - 4}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" style="fill:var(--mut)">${String(+v.toFixed(1)).replace('.', ',')} h</text>`).join('');
  const bars = vals.map((v, i) => `<rect x="${cx(i) - bar / 2}" y="${y(v)}" width="${bar}" height="${Math.max(0, H - B - y(v))}" rx="3" style="fill:var(--ac)"><title>${blabel(a.keys[i], f.gran)}: ${fdur(v * 3600)} de exibição${showO ? ' · ' + fdur(onl[i] * 3600) + ' online' : ''}</title></rect>`).join('');
  const labs = a.keys.map((k, i) => i % step ? '' : `<text x="${cx(i)}" y="${H - 8}" text-anchor="middle" font-size="11" style="fill:var(--mut)">${blabel(k, f.gran)}</text>`).join('');
  const line = !showO ? '' : n > 1 ? `<polyline fill="none" stroke-width="2" stroke-dasharray="5 4" style="stroke:var(--mut)" points="${onl.map((v, i) => `${cx(i)},${y(v)}`).join(' ')}"/>` : `<circle cx="${cx(0)}" cy="${y(onl[0])}" r="4" style="fill:var(--mut)"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Horas de exibição por período">${grid}${bars}${line}${labs}</svg>`;
}
async function relLoad() {
  const [from, to] = relRange(iso(new Date()));
  $('#page').innerHTML = '<div class="card"><p class="mut">Carregando…</p></div>';
  try { R.data = await api(`stats?from=${from}&to=${to}`); }
  catch (e) { if (e.message !== 'login') $('#page').innerHTML = `<div class="card"><p>${esc(e.message)}</p><button onclick="R.preset='7d';relLoad()">Voltar para 7 dias</button></div>`; return; }
  relDraw();
}
function relDraw() {
  const d = R.data, [from, to] = relRange(iso(new Date())), f = { screen: R.screen, content: R.content, gran: R.gran }, a = relAgg(d, from, to, f);
  const cids = new Set(), sids = new Set();
  for (const day of Object.values(d.days)) for (const [sid, e] of Object.entries(day)) { sids.add(sid); Object.keys(e.c || {}).forEach(c => cids.add(c)); }
  const nm = c => d.names[c] || 'Conteúdo removido', sn = s => d.screens[s] || 'Tela removida';
  const opt = (v, cur, t) => `<option value="${esc(v)}"${v === cur ? ' selected' : ''}>${esc(t)}</option>`;
  const P = [['today', 'Hoje'], ['7d', '7 dias'], ['30d', '30 dias'], ['month', 'Este mês'], ['lastmonth', 'Mês passado'], ['custom', 'Personalizado']];
  const empty = !a.tot.secs && !a.tot.online;
  const kpi = (t, v, sub) => `<div class="card"><h3>${t}</h3><div style="font-size:26px;font-weight:700">${v}</div><div class="mut" style="font-size:13px">${sub}</div></div>`;
  const rowsS = Object.entries(a.perScreen).sort((x, y) => y[1].secs - x[1].secs || y[1].online - x[1].online).map(([s, v]) =>
    `<tr style="cursor:pointer" onclick="R.screen='${esc(s)}';relDraw()"><td>${esc(sn(s))}</td><td>${fdur(v.online)}</td><td>${fdur(v.secs)}</td><td>${v.online ? Math.round(v.secs / v.online * 100) + '%' : '—'}</td><td>${v.plays}</td></tr>`).join('');
  const rowsC = Object.entries(a.perContent).sort((x, y) => y[1].secs - x[1].secs).map(([c, v]) =>
    `<tr style="cursor:pointer" onclick="R.content='${esc(c)}';relDraw()"><td>${esc(nm(c))}</td><td>${fdur(v.secs)}</td><td>${fhr(v.secs / Math.max(a.days, 1))} h/dia</td><td>${a.tot.secs ? Math.round(v.secs / a.tot.secs * 100) + '%' : '—'}</td><td>${v.plays}</td></tr>`).join('');
  $('#page').innerHTML = `<div class="card"><div class="ph"><h1>Relatórios de exibição</h1><button onclick="relLoad()">Atualizar</button><button class="p" onclick="relCsv()">Exportar CSV</button></div>
  <div class="tb">${P.map(([k, t]) => `<button class="${R.preset === k ? 'p' : ''}" onclick="R.preset='${k}';${k === 'custom' ? `R.from='${from}';R.to='${to}';` : ''}relLoad()">${t}</button>`).join('')}
    ${R.preset === 'custom' ? `<label>de <input type="date" value="${from}" max="${iso(new Date())}" onchange="R.from=this.value;relLoad()"></label><label>até <input type="date" value="${to}" max="${iso(new Date())}" onchange="R.to=this.value;relLoad()"></label>` : ''}</div>
  <div class="tb"><label>Agrupar por <select onchange="R.gran=this.value;relDraw()">${[['day', 'Dia'], ['week', 'Semana'], ['month', 'Mês']].map(([k, t]) => opt(k, R.gran, t)).join('')}</select></label>
    <label>Tela <select onchange="R.screen=this.value;relDraw()">${opt('', R.screen, 'Todas as telas')}${[...sids].sort((x, y) => sn(x).localeCompare(sn(y))).map(s => opt(s, R.screen, sn(s))).join('')}</select></label>
    <label>Conteúdo <select onchange="R.content=this.value;relDraw()">${opt('', R.content, 'Todos os conteúdos')}${[...cids].sort((x, y) => nm(x).localeCompare(nm(y))).map(c => opt(c, R.content, nm(c))).join('')}</select></label></div>
  <div class="stats">${kpi('Horas de exibição', fdur(a.tot.secs), 'tempo real na tela')}${kpi('Média por dia', fdur(a.tot.secs / Math.max(a.days, 1)), a.days + (a.days === 1 ? ' dia' : ' dias') + ' no período')}${kpi('Exibições', a.tot.plays.toLocaleString('pt-BR'), 'vezes que um conteúdo tocou')}${kpi('Horas online', fdur(a.tot.online), 'telas em contato com o servidor')}</div></div>
  <div class="card"><h3 style="margin:0 0 8px;font-size:14px;text-transform:uppercase">${f.content ? esc(nm(f.content)) : 'Todos os conteúdos'} · ${f.screen ? esc(sn(f.screen)) : 'todas as telas'}</h3>
    ${empty ? '<p class="mut">Ainda não há dados neste período. Os players enviam o relatório a cada minuto (precisam estar com a versão nova do player.html).</p>' : relChart(a, f) + `<div class="lg"><span><i style="background:var(--ac)"></i>Horas de exibição</span>${f.content ? '' : '<span><i style="background:var(--mut)"></i>Horas online</span>'}</div>`}</div>
  <div class="card"><h3 style="margin:0 0 8px;font-size:14px;text-transform:uppercase">Por tela</h3><div class="tw"><table><thead><tr><th>Tela</th><th>Online</th><th>Exibição</th><th>Exibição / online</th><th>Exibições</th></tr></thead><tbody>${rowsS || '<tr><td colspan="5" class="mut">Sem dados</td></tr>'}</tbody></table></div></div>
  <div class="card"><h3 style="margin:0 0 8px;font-size:14px;text-transform:uppercase">Por conteúdo</h3><div class="tw"><table><thead><tr><th>Conteúdo</th><th>Exibição</th><th>Média</th><th>% do total</th><th>Exibições</th></tr></thead><tbody>${rowsC || '<tr><td colspan="5" class="mut">Sem dados</td></tr>'}</tbody></table></div>
  <p class="mut" style="font-size:13px">Clique numa linha para filtrar. A exibição pode passar de 100% do tempo online: a tela continua tocando sem internet e envia o relatório quando volta. Os dias seguem o fuso ${esc(d.tz)}.</p></div>`;
}
function relCsv() {
  const d = R.data, [from, to] = relRange(iso(new Date())), q = v => `"${String(v).replace(/"/g, '""')}"`, out = ['Data;Tela;Conteúdo;Horas exibidas;Exibições'];
  for (const day of Object.keys(d.days).sort()) for (const [sid, e] of Object.entries(d.days[day])) {
    if (R.screen && R.screen !== sid) continue;
    for (const [cid, [sec, n]] of Object.entries(e.c || {})) { if (R.content && R.content !== cid) continue;
      out.push([day, q(d.screens[sid] || sid), q(d.names[cid] || cid), (sec / 3600).toFixed(2).replace('.', ','), n].join(';')); }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff' + out.join('\r\n')], { type: 'text/csv;charset=utf-8' })); a.download = `exibicao_${from}_${to}.csv`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
const pRel = () => relLoad();

/* ---------- rotas ---------- */
function route() {
  const [r = 'telas', id] = location.hash.replace(/^#\//, '').split('/');
  document.querySelectorAll('.side nav a').forEach(a => a.classList.toggle('on', a.dataset.r === r));
  sideStatus(); if (r !== 'listas' || !id) ed = null;
  ({ telas: pTelas, arquivos: pArquivos, listas: () => id ? pEditor(id) : pListas(), relatorios: pRel, status: pStatus, conta: pConta }[r] || pTelas)();
}
addEventListener('hashchange', () => $('#page') && route());
setInterval(async () => { if (!token || dlg.open || !$('#page')) return; try { await load(); } catch { return; } sideStatus();
  const h = location.hash; if (h.includes('status')) pStatus(); else if (h.includes('conta')) pConta(); else if ((!h || h.includes('telas')) && $('#tbl')) renderTbl('screens'); }, 10000);
token ? boot().catch(x => { if (x.message !== 'login') showLogin(); }) : showLogin();
</script></body></html>
