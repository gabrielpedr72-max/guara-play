# Compila o APK na nuvem (GitHub Actions, gratuito). Não precisa instalar nada no seu computador.
name: Gerar APK
on:
  workflow_dispatch:      # botão "Run workflow" na aba Actions
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.7' }
      - name: Chave de assinatura
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > guara.keystore
          else
            echo "AVISO: sem o segredo KEYSTORE_B64 a chave muda a cada build (não dá para atualizar aparelhos instalados)."
            keytool -genkeypair -keystore guara.keystore -storepass guaraplay -keypass guaraplay \
              -alias guara -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=Guara Play"
          fi
      - name: Compilar
        run: gradle assembleDebug -PserverUrl="${{ vars.SERVER_URL }}" -PadminPin="${{ secrets.ADMIN_PIN }}"
      - uses: actions/upload-artifact@v4
        with:
          name: guara-play-apk
          path: app/build/outputs/apk/debug/app-debug.apk
